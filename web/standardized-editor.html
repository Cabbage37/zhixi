<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>规范文稿 · 知析</title>
<style>html,body{height:100%;margin:0}body{display:flex;flex-direction:column;font:15px system-ui}header{display:flex;align-items:center;gap:1rem;padding:.5rem 1rem}button{padding:.5rem 1rem;cursor:pointer}#editor,iframe{flex:1;min-height:0}p{margin:0}</style>
<header><button disabled>保存并下载 Word</button><p role="status">正在打开规范文稿…</p></header><div id="editor"></div>
<script>
(async()=>{
  const notice=document.querySelector('p');
  const button=document.querySelector('button');
  try {
    const taskId=new URLSearchParams(location.search).get('task');
    const response=await fetch('/api/editor/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({taskId})});
    const data=await response.json();
    if(!response.ok)throw Error(data.error);
    await new Promise((resolve,reject)=>{
      const script=document.createElement('script');script.src=data.server+'/web-apps/apps/api/documents/api.js';
      script.onload=resolve;script.onerror=()=>reject(Error('文档编辑服务加载失败'));document.head.append(script);
    });
    notice.textContent='正在读取规范文稿…';
    new DocsAPI.DocEditor('editor',{...data.config,events:{
      onDocumentReady:()=>{notice.textContent='正在编辑规范文稿副本';button.disabled=false;document.title=data.config.document.title+' · 知析';},
      onDocumentStateChange:event=>{
        button.disabled=event.data===true;
        notice.textContent=event.data===true?'正在同步修改…':'修改已同步，可以下载';
      },
      onError:()=>{notice.hidden=false;notice.textContent='在线编辑出现错误，请返回任务页面下载规范文稿。'}
    }});
    button.onclick=async()=>{
      button.disabled=true;notice.textContent='正在保存修改…';
      try{
        const saved=await fetch('/api/editor/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:data.sid})});
        const request=await saved.json();
        if(!saved.ok)throw Error(request.error);
        for(let i=0;i<30;i++){
          const state=await (await fetch('/api/editor/state/'+data.sid)).json();
          if(state.error||state.saveError)throw Error(state.error||state.saveError);
          if(request.unchanged||state.saved>request.previousSaved){
            const link=document.createElement('a');link.href='/editor-download/'+data.sid+'/current.docx';
            link.download='规范文稿.docx';link.click();notice.textContent='已保存，正在下载';return;
          }
          await new Promise(resolve=>setTimeout(resolve,1000));
        }
        throw Error('保存尚未完成，请稍后重试');
      }catch(error){notice.textContent=error.message}finally{button.disabled=false}
    };
  }catch(error){notice.textContent=error.message+'。可返回知析下载已生成的文件。'}
})();
</script></html>
