<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 工坊</title><link rel="stylesheet" href="/assets/workshop-chat.css"><style>body{margin:0;font:15px/1.6 "Microsoft YaHei",sans-serif;color:#302e2b}main{display:flex;height:calc(98vh - 46px)}section{flex:1;min-width:0}aside{flex:0 1 32%;padding:18px;border-left:1px solid #ddd}aside{overflow:auto}aside [role=alert]{color:#903d1a;background:#fff2e4;padding:10px;border-radius:7px}aside.app-preview{flex-basis:58%}aside.app-preview iframe{display:block;margin-top:12px}aside p{white-space:pre-wrap}aside button{padding:9px 17px;background:#a85a19;color:white;border-radius:9px}@media(max-width:650px){main{flex-direction:column}aside{overflow:auto}}.chat-actions{height:44px;display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:0 12px}.chat-actions button{background:white;color:#663b1b;border:1px solid #dbd0c4;padding:5px 12px;border-radius:8px;cursor:pointer}</style><div id="root"></div><script src="/assets/workshop-chat.js"></script></html>
